# Render blueprint — "New +" → Blueprint → point at this repo.
# Render reads this file and sets the whole service up automatically.
services:
  - type: web
    name: suraj-portfolio
    runtime: node
    plan: free
    # free instances are only offered in oregon
    region: oregon
    autoDeploy: true
    # devDependencies (typescript, vite) are required to build the client,
    # so --include=dev is mandatory: NODE_ENV=production applies at build time too.
    buildCommand: >-
      npm install --prefix server --include=dev &&
      npm install --prefix client --include=dev &&
      npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PATH
        value: /CHANGE_ME_ADMIN_PATH
      # Password is entered in the Render dashboard (never stored in git).
      - key: ADMIN_TOKEN
        sync: false
