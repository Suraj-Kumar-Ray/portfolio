# Render blueprint — "New +" → Blueprint → point at this repo.
# Render reads this file and sets the whole service up automatically.
services:
  - type: web
    name: suraj-portfolio
    runtime: node
    plan: free
    # free instances are only offered in oregon
    region: oregon
    autoDeploy: true
    # devDependencies (typescript, vite) are required to build the client,
    # so --include=dev is mandatory: NODE_ENV=production applies at build time too.
    buildCommand: >-
      npm install --prefix server --include=dev &&
      npm install --prefix client --include=dev &&
      npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Secret panel path + password are set in the Render dashboard, never in git.
      - key: ADMIN_PATH
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      # MongoDB Atlas connection string (see README → "Durable data"). Without,
      # the free instance keeps data on its ephemeral disk and a redeploy wipes
      # messages, analytics and panel edits.
      - key: MONGODB_URI
        sync: false
